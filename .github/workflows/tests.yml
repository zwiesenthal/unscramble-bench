name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
      - run: python main.py --validate-only
      - run: python main.py --questions questions/ops-reconciliation.json --validate-only
      - run: python word_unscramble.py --validate-only
