name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
      - run: python main.py --validate-only
      - run: python main.py --questions questions/ops-reconciliation.json --validate-only
      - run: python word_unscramble.py --validate-only
      - run: python scripts/generate_hard_questions.py --check questions/hard-reasoning.json --regenerate
      - run: python scripts/generate_hard_questions.py --check questions/alignment-contracts.json --regenerate
